<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Premium Movie Recommendations</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-glob"></div>
    <div class="background-glob glob-2"></div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-film"></i> CineMatch
            </div>
            <h1>Discover Your Next Favorite Movie</h1>
            <p>Powered by NLP & Machine Learning</p>
        </header>

        <main>
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="movieInput" placeholder="Enter a movie you love (e.g., Toy Story)..."
                        autocomplete="off" aria-label="Movie search input">
                    <button id="searchBtn">Recommend</button>
                    <div id="suggestions" class="suggestions-list hidden"></div>
                </div>

                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p style="text-align:center; margin-top:10px; color:var(--text-secondary);">Finding perfect
                        matches...</p>
                </div>

                <div id="error" class="hidden"></div>
            </div>

            <div id="resultsSection" class="hidden">
                <h2>Top Picks For You</h2>
                <div class="grid" id="recommendationsGrid"></div>
            </div>
        </main>

        <footer>
            <p>Built with Python & Flask • Powered by TMDB</p>
            <p>By Ankit Kumar Singh</p>
        </footer>
    </div>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
